name: CI/CD-Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# O job só lê o código; sem isto o token recebe as permissões padrão do
# repositório, que podem incluir escrita.
permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      SECRET_KEY: ci-secret-key-not-used-in-production
      DEBUG: "0"
      ALLOWED_HOSTS: localhost,127.0.0.1
      CSRF_TRUSTED_ORIGINS: http://localhost,http://127.0.0.1
      ADMIN_PANEL_PATH: admin/
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            test-requirements.txt

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libpq-dev libsasl2-dev libldap-dev

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r test-requirements.txt

      - name: Audit dependencies for known vulnerabilities
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run migrations
        run: python manage.py migrate --noinput

      - name: Run tests
        run: pytest -vv

  # Roda no próprio servidor, por um runner self-hosted: o sistema não tem porta
  # aberta para o GitHub alcançar. Só no push para a main, e nunca em pull
  # request, que executaria no servidor código ainda não revisado. Em repositório
  # público, exija aprovação para workflows de colaboradores externos: um PR de
  # fork pode trocar o runs-on de outro job para o runner do servidor.
  #
  # Desligado até o repositório ter as variáveis DEPLOY_PATH (a pasta do projeto
  # no servidor) e RUNNER_LABEL (a label própria dada ao runner no config.sh).
  deploy:
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_PATH != '' && vars.RUNNER_LABEL != ''
    runs-on: [self-hosted, "${{ vars.RUNNER_LABEL }}"]
    concurrency: deploy
    steps:
      - name: Update code and rebuild
        working-directory: ${{ vars.DEPLOY_PATH }}
        run: |
          git pull --ff-only
          make build-system

      # O build-system acabou de gerar um backup: confere se ele restaura.
      - name: Check backup
        working-directory: ${{ vars.DEPLOY_PATH }}
        run: make check-backup
