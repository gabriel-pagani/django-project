name: ${PROJECT_NAME}

# O json-file do Docker cresce sem limite; o gunicorn e o nginx registram cada acesso.
x-logging: &logging
  options:
    max-size: 10m
    max-file: "5"

services:
  postgres:
    image: postgres:18
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    # Cada serviço recebe só o que usa. Variável sem valor vem do .env ao lado
    # e, se não estiver lá, fica de fora (o padrão do settings continua valendo).
    environment:
      - POSTGRES_DB
      - POSTGRES_USER
      - POSTGRES_PASSWORD
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - backend
    restart: unless-stopped
    logging: *logging

  redis:
    image: redis:8-alpine
    expose:
      - "6379"
    # O Redis guarda as sessões, e o cache do Django lê pickle dele: quem escreve
    # aqui forja a sessão de qualquer um e executa código no Django. A imagem
    # oficial sobe sem senha e sem protected-mode.
    #
    # A senha vai pela variável, e não pela linha de comando do compose, para não
    # aparecer no docker inspect. O redis-cli do healthcheck lê a mesma variável.
    # O docker-entrypoint.sh é o que troca o root pelo usuário redis.
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?defina REDIS_PASSWORD no deploy/.env}
    command: ["sh", "-c", "exec docker-entrypoint.sh redis-server --requirepass \"$$REDISCLI_AUTH\" --appendonly yes --save ''"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - backend
    restart: unless-stopped
    logging: *logging

  django:
    build:
      context: ../
      dockerfile: deploy/Dockerfile
      target: production
    image: ${PROJECT_NAME}-django
    expose:
      - "8000"
    volumes:
      - static_volume:/app/static_root
      - media_volume:/app/media_root
    # Sem a senha do superusuário do Postgres (o app entra com o usuário restrito)
    # e sem os tokens da Cloudflare: quem invadisse o app não leva o túnel.
    # Variável nova do settings precisa entrar nesta lista.
    environment:
      - SECRET_KEY
      - DEBUG
      - ALLOWED_HOSTS
      - CSRF_TRUSTED_ORIGINS
      - ADMIN_PANEL_PATH
      - POSTGRES_DB
      - POSTGRES_APP_USER
      - POSTGRES_APP_PASSWORD
      - POSTGRES_HOST
      - POSTGRES_PORT
      - REDIS_URL
      - REDIS_PASSWORD
      - EMAIL_BACKEND
      - EMAIL_HOST
      - EMAIL_PORT
      - EMAIL_HOST_USER
      - EMAIL_HOST_PASSWORD
      - EMAIL_USE_TLS
      - EMAIL_TIMEOUT
      - DEFAULT_FROM_EMAIL
      - ADMINS
      - AUTH_LDAP_SERVER_URI
      - AUTH_LDAP_BIND_DN
      - AUTH_LDAP_BIND_PASSWORD
      - AUTH_LDAP_USER_SEARCH
      - AUTH_LDAP_GROUP_SEARCH
      - STAFF_GROUP_DN
      - ADMIN_GROUP_DN
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn project.wsgi:application --bind 0.0.0.0:8000 --workers 4 --threads 2 --timeout 60 --access-logfile - --error-logfile -"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import socket; s=socket.socket(); s.settimeout(2); s.connect((\"127.0.0.1\",8000)); s.close()'"]
      interval: 5s
      timeout: 5s
      retries: 12
    # O app roda como usuário comum numa porta alta e não usa nenhuma capability.
    # Sem elas e sem setuid, quem rodasse código aqui não vira root no container.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # O único na frente e atrás: o proxy fala com ele, e ele com o banco. A rede
    # da frente também é a saída dele para a internet.
    networks:
      - backend
      - frontend
    restart: unless-stopped
    logging: *logging

  # Scripts de manutenção (make create-app-role) precisam de segredos que o app
  # não recebe; só sobem quando chamados.
  tools:
    build:
      context: ../
      dockerfile: deploy/Dockerfile
      target: production
    image: ${PROJECT_NAME}-django
    env_file:
      - .env
    profiles:
      - tools
    networks:
      - backend
      - frontend

  tests:
    build:
      context: ../
      dockerfile: deploy/Dockerfile
      target: test
    image: ${PROJECT_NAME}-django-tests
    volumes:
      - ../app:/app/app
      - ../project:/app/project
      - ../templates:/app/templates
      - ../static:/app/static
      - ../tests:/app/tests
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    command: python -m pytest -vv
    profiles:
      - tests
    networks:
      - backend

  nginx:
    image: nginx:1.30-alpine
    expose:
      - "80"
    volumes:
      - static_volume:/app/static_root
      - media_volume:/app/media_root:ro
      - ./http.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      django:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 80"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - frontend
    restart: unless-stopped
    logging: *logging

  cloudflare:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TOKEN}
    depends_on:
      nginx:
        condition: service_healthy
    networks:
      - frontend
    restart: unless-stopped
    logging: *logging

volumes:
  static_volume:
  media_volume:
  postgres_data:
  redis_data:

networks:
  # Banco e Redis ficam só aqui: sem saída para fora, e fora do alcance do nginx
  # e do túnel, que são as peças expostas.
  backend:
    internal: true
  frontend: