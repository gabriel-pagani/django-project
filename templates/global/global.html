{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}{% endblock %}</title>
    <link href="{% static 'global/css/reset.css' %}" rel="stylesheet" />
    <link href="{% static 'global/css/global.css' %}" rel="stylesheet" />
    <script src="{% static 'global/js/global.js' %}" defer></script>
    {% block head %}{% endblock %}
  </head>
  <body>
    {% if messages %}
    <ul class="messages" role="status">
      {% for message in messages %}<li class="{{ message.tags }}">{{ message }}</li>{% endfor %}
    </ul>
    {% endif %}
    {% block body %}{% endblock %}
  </body>
</html>
